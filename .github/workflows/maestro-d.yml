# maestro-d's own checks and releases. Kept apart from ci.yml (upstream
# maestro-runner's workflow) so rebases never conflict there.
name: Daemon

on:
  push:
    branches: [master]
    tags: ['maestro-d-v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'  # as ci.yml
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: npm/maestro-d/package-lock.json

      # The capture tests check every muxed file with ffprobe. Ubuntu's apt
      # FFmpeg is 6.x; the ipcm/pcmC checks need FFmpeg 7.1 or later. BtbN's
      # static builds keep only the newest release branches, so this is 9.0,
      # the FFmpeg the checks were written against.
      - name: Install FFmpeg 9.0
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-n9.0-latest-linux64-gpl-9.0/bin" >> "$GITHUB_PATH"

      # The Go/TypeScript/Markdown command tables must match the flow parser.
      - name: Generated command tables are current
        run: make gen-check

      - name: Go tests (daemon, CLI, capture, hub, executor, mock driver)
        env:
          MAESTRO_D_REQUIRE_FFPROBE: '1'  # ffprobe-backed tests fail rather than skip
        run: ffprobe -version | head -1 && go test -race -timeout 20m ./pkg/daemon/... ./pkg/cli/... ./pkg/capture/... ./pkg/hub/... ./pkg/executor/... ./pkg/driver/mock/... ./pkg/device/... ./pkg/driver/uiautomator2/... ./pkg/driver/devicelab/...

      - name: JavaScript library tests
        run: npm ci --no-audit --no-fund && npm test
        working-directory: npm/maestro-d

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/maestro-d-v')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'  # as ci.yml
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#maestro-d-v}" >> "$GITHUB_OUTPUT"

      - name: Build npm packages
        run: VERSION=${{ steps.v.outputs.version }} ./npm/build-maestro-d-npm.sh

      # The tarballs, SHA256SUMS and install.sh that
      # `curl -fsSL …/releases/latest/download/install.sh | bash` installs from.
      - name: Build release tarballs
        run: VERSION=${{ steps.v.outputs.version }} ./npm/build-maestro-d-tarballs.sh

      # A version with a pre-release part (2.0.0-rc.1) is a prerelease and
      # never becomes "latest", so the curl install keeps the last release.
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            npm/dist-maestro-d/${{ steps.v.outputs.version }}/*.tgz
            npm/dist-maestro-d/${{ steps.v.outputs.version }}/*.tar.gz
            npm/dist-maestro-d/${{ steps.v.outputs.version }}/SHA256SUMS
            npm/dist-maestro-d/${{ steps.v.outputs.version }}/install.sh
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.v.outputs.version, '-') }}
          generate_release_notes: true

      # Platform packages first, so the main package never resolves to a
      # version that does not exist. Skipped when no npm token is configured.
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          v=${{ steps.v.outputs.version }}
          for t in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            npm publish "npm/dist-maestro-d/$v/maestro-d-$t-$v.tgz" --access public
          done
          npm publish "npm/dist-maestro-d/$v/maestro-d-$v.tgz" --access public
